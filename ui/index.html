<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: https://raw.githubusercontent.com https://github.com https://avatars.githubusercontent.com; connect-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Central HDL</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topo">
    <div class="marca"><span class="marca-logo" aria-hidden="true">HDL</span><div><h1>Central HDL</h1><div class="central-versao"><small id="versao"></small><span id="central-status" class="central-status" aria-live="polite"></span><button id="central-atualizar" class="link-btn" type="button" hidden>Atualizar a Central</button></div></div></div>
    <div class="busca"><input id="busca" type="search" placeholder="Buscar aplicativos" aria-label="Buscar aplicativos"></div>
    <div class="topo-acoes">
      <button id="verificar" class="btn btn-sec" type="button">Procurar atualizações</button>
      <button id="atualizar-tudo" class="btn" type="button" hidden>Atualizar tudo</button>
      <button id="abrir-config" class="icone-btn" type="button" title="Configurações" aria-label="Configurações">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM19 12l2-1-1-3-2 .2-1.3-1.3L17 5l-3-1-1 2h-2L10 4 7 5l.3 2L6 8.2 4 8l-1 3 2 1-2 1 1 3 2-.2 1.3 1.3L7 19l3 1 1-2h2l1 2 3-1-.3-2 1.3-1.3 2 .3 1-3z"/></svg>
      </button>
    </div>
  </header>
  <div id="faixa-central" class="faixa" hidden></div>
  <nav class="abas" role="tablist" aria-label="Filtro">
    <button role="tab" data-filtro="todos" aria-selected="true">Todos</button>
    <button role="tab" data-filtro="instalados" aria-selected="false">Instalados</button>
    <button role="tab" data-filtro="atualizacoes" aria-selected="false">Atualizações <span id="n-atualizacoes" class="selo" hidden></span></button>
  </nav>
  <main id="lista" class="grade" aria-live="polite"><p class="vazio">Carregando catálogo…</p></main>

  <dialog id="config">
    <form method="dialog">
      <h2>Configurações</h2>
      <label class="alternador"><span><b>Atualizar apps automaticamente</b><small>Instala novas versões em segundo plano. Apps abertos não são interrompidos: você recebe um aviso.</small></span><input type="checkbox" id="cfg-auto"></label>
      <label class="alternador"><span><b>Iniciar com o Windows</b><small>A Central fica na bandeja e mantém tudo atualizado.</small></span><input type="checkbox" id="cfg-login"></label>
      <div class="dlg-rodape"><button class="btn" value="ok">Fechar</button></div>
    </form>
  </dialog>
  <div id="toasts" aria-live="polite"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
